name: Daily official schedule
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-schedule-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run update:schedule -- --force
      - run: node scripts/build-history.mjs
      - run: npm test
      - run: npm run check:public
      - name: Publish only validated public schedule and history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node scripts/check-history-publication.mjs
          git add -- data/schedule.json data/prediction-history.json
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then exit 0; fi
          while IFS= read -r file; do
            case "$file" in
              data/schedule.json|data/prediction-history.json) ;;
              *) echo "Unexpected staged path"; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --cached --check
          node scripts/check-history-publication.mjs
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore: refresh official schedule and forecast history"
          node scripts/check-history-publication.mjs
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
