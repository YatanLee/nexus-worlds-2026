name: Daily official schedule
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-schedule-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm run update:schedule -- --force
      - run: npm test
      - run: npm run check:public
      - name: Commit only validated public schedule
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add -- data/schedule.json
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then exit 0; fi
          test "$changed" = "data/schedule.json"
          git diff --cached --check
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore: refresh official Worlds schedule"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:main
