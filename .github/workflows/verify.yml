name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.mjs
          node --check data.mjs
          node --check model.mjs
          node --check server.mjs
          node --check schedule.mjs
          node --check crawler.mjs
          node --check history.mjs
          node --check history-sync.mjs
          node --check history-ui.mjs
          node --check scripts/build-history.mjs
          node --check scripts/check-history-publication.mjs
          node --check scripts/update-schedule.mjs
      - run: npm test
      - run: npm run check:public
      - run: git diff --check
